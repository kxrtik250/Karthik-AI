services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: karthik_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karthik_ai
      POSTGRES_PASSWORD: karthik_ai_dev
      POSTGRES_DB: karthik_ai_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karthik_ai -d karthik_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
